      animation: forest-drift 28s ease-in-out infinite alternate;
    }
    .overlay {
      z-index: -3;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(13, 31, 20, .55), rgba(13, 31, 20, .72) 46%, rgba(13, 31, 20, .84)),
        linear-gradient(180deg, rgba(18, 34, 23, .24), rgba(18, 34, 23, .58));
    }
    .mist {
      z-index: -2;
      opacity: .3;
      filter: blur(48px);
      background: radial-gradient(ellipse at 25% 42%, rgba(231, 241, 215, .25), transparent 38%);
      animation: mist-drift 18s ease-in-out infinite alternate;
    }
    .mist-two {
      opacity: .22;
      background: radial-gradient(ellipse at 76% 63%, rgba(255, 255, 255, .24), transparent 36%);
      animation-delay: -9s;
    }
    .fireflies { z-index: -1; opacity: .8; }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 900px);
      transform: translateY(-8px);
    }
    .tagline, h1, .rule, .subheading, .description, .actions, .closing { margin: 0; }
    .tagline {
      padding-bottom: 14px;
      color: rgba(255, 255, 255, .86);
      font: 300 clamp(.68rem, 1.3vw, .82rem)/1.4 "Jost", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: .25em;
      text-transform: uppercase;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(30px);
      animation: rise-clear .9s .2s cubic-bezier(.2, .9, .2, 1) forwards, tagline-glow 4s 1.2s ease-in-out infinite;
    }
    h1 {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      color: #fff;
      font: 300 clamp(4.1rem, 13.3vw, 9rem)/.95 "Cormorant Garamond", Georgia, serif;
      letter-spacing: -.045em;
      perspective: 700px;
    }
    .letter {
      display: inline-block;
      background: linear-gradient(180deg, #fff 8%, #d6e7ca 100%);
      background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(80px) rotateX(-70deg);
      transform-origin: bottom center;
      animation: flip-letter .85s cubic-bezier(.2, .9, .2, 1) forwards;
    }
    .rule {
      width: min(320px, 56vw);
      height: 1px;
      margin: 24px 0 20px;
      background: linear-gradient(90deg, transparent, rgba(223, 230, 190, .95), rgba(198, 162, 101, .85), transparent);
      transform: scaleX(0);
      transform-origin: center;
      animation: grow-rule .85s 2.05s cubic-bezier(.2, .9, .2, 1) forwards;
    }
    .subheading {
      color: rgba(255, 255, 255, .95);
      font: italic 300 clamp(1.55rem, 3.7vw, 2.5rem)/1.1 "Cormorant Garamond", Georgia, serif;
      opacity: 0;
      transform: translateY(20px);
      animation: rise-in .8s 2.2s cubic-bezier(.2, .9, .2, 1) forwards;
    }
    .subheading span { color: var(--accent); }
    .description {
      max-width: 640px;
      margin-top: 16px;
      color: rgba(255, 255, 255, .84);
      font: 300 clamp(.9rem, 1.5vw, 1.05rem)/1.8 "Jost", "Helvetica Neue", Arial, sans-serif;
      opacity: 0;
      transform: translateY(18px);
      animation: rise-in .8s 2.55s cubic-bezier(.2, .9, .2, 1) forwards;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 26px;
      opacity: 0;
      transform: translateY(18px);
      animation: rise-in .8s 2.95s cubic-bezier(.2, .9, .2, 1) forwards;
    }
    .button {
      position: relative;
      z-index: 0;
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
      padding: 0 25px;
      border: 1px solid rgba(255, 255, 255, .64);
      border-radius: 999px;
      color: #fff;
      font: 300 .9rem "Jost", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: .04em;
      text-decoration: none;
      transition: transform .35s cubic-bezier(.2, .9, .2, 1), border-color .35s ease, box-shadow .35s ease;
    }
    .button::before {
      position: absolute;
      z-index: -1;
      inset: 100% 0 0;
      border-radius: inherit;
      background: #355c3d;
      content: "";
      transition: inset .35s cubic-bezier(.2, .9, .2, 1);
    }
    .button:hover, .button:focus-visible {
      transform: translateY(-4px) scale(1.04);
      border-color: #9fc49b;
      box-shadow: 0 0 28px rgba(127, 183, 125, .38);
    }
    .button:hover::before, .button:focus-visible::before { inset: 0; }
    .button:focus-visible { outline: 2px solid #e4d19e; outline-offset: 5px; }
    .button-primary {
      border-color: rgba(213, 159, 121, .9);
      background: var(--clay);
      animation: ring-pulse 2.8s 3.8s ease-out infinite;
    }
    .button-secondary { background: rgba(255, 255, 255, .035); backdrop-filter: blur(8px); }
    .closing {
      margin-top: 22px;
      color: var(--green);
      font: italic 300 clamp(1rem, 2vw, 1.25rem) "Cormorant Garamond", Georgia, serif;
      opacity: 0;
      transform: translateY(14px);
      animation: rise-in .8s 3.35s cubic-bezier(.2, .9, .2, 1) forwards;
    }
    .scroll {
      position: absolute;
      bottom: max(17px, env(safe-area-inset-bottom));
      left: 50%;
      width: 1px;
      height: 30px;
      overflow: hidden;
      background: rgba(255, 255, 255, .28);
      transform: translateX(-50%);
    }
    .scroll span {
      position: absolute;
      top: -45%;
      left: 0;
      width: 1px;
      height: 45%;
      background: #e7e5ce;
      box-shadow: 0 0 8px rgba(255, 255, 255, .9);
      animation: scroll-streak 1.8s 3.8s ease-in-out infinite;
    }
    @keyframes forest-drift {
      from { transform: scale(1) translate3d(0, 0, 0); }
      to { transform: scale(1.18) translate3d(-1.3%, 1%, 0); }
    }
    @keyframes mist-drift {
      from { transform: translate3d(-3%, -1%, 0) scale(.95); }
      to { transform: translate3d(4%, 2%, 0) scale(1.12); }
    }
    @keyframes rise-clear { to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    @keyframes tagline-glow {
      0%, 100% { text-shadow: 0 0 0 rgba(220, 235, 194, 0); }
      50% { text-shadow: 0 0 15px rgba(220, 235, 194, .45); }
    }
    @keyframes flip-letter { to { opacity: 1; transform: translateY(0) rotateX(0); } }
    @keyframes grow-rule { to { transform: scaleX(1); } }
    @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes ring-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(198, 162, 101, .3); }
      55% { box-shadow: 0 0 0 11px rgba(198, 162, 101, 0); }
    }
    @keyframes scroll-streak {
      from { transform: translateY(0); }
      to { transform: translateY(95px); }
    }
    @media (max-width: 600px) {
      .landing { padding-right: 20px; padding-left: 20px; }
      .content { transform: translateY(-10px); }
      h1 { font-size: clamp(3.7rem, 16vw, 6.2rem); }
      .tagline { padding-bottom: 17px; letter-spacing: .18em; }
      .rule { margin: 20px 0 17px; }
      .description { max-width: 470px; line-height: 1.65; }
      .actions { gap: 11px; margin-top: 22px; }
      .button { min-height: 46px; padding: 0 20px; font-size: .84rem; }
      .closing { margin-top: 18px; }
    }
    @media (max-height: 700px) { .content { transform: scale(.88); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; transition-duration: .001ms !important; }
      .tagline, .letter, .subheading, .description, .actions, .closing {
        opacity: 1;
        filter: none;
        transform: none;
      }
      .rule { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <main class="landing">
    <div class="background" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <div class="mist mist-two" aria-hidden="true"></div>
    <canvas class="fireflies" aria-hidden="true"></canvas>
    <section class="content" aria-labelledby="landing-title">
      <p class="tagline">A natural sanctuary · Kabini</p>
      <h1 id="landing-title" aria-label="Breathe in."></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="subheading">You&apos;re in <span>Kabini.</span></p>
      <p class="description">Welcome to AnantaVana — where the forest breathes with you. A nature-led sanctuary created by Vanatvam, shaped around the quiet beauty of the Kabini region.</p>
      <div class="actions">
        <a class="button button-primary" href="/assets/project-images/AnantaVana%20Brochure.pdf" download>Download brochure <span aria-hidden="true">↓</span></a>
        <a class="button button-secondary" href="contact.html">Plan a visit</a>
      </div>
      <p class="closing">Live where nature still whispers.</p>
    </section>
    <div class="scroll" aria-hidden="true"><span></span></div>
  </main>
  <script>
    (() => {
      const headline = "Breathe in.";
      const title = document.querySelector("#landing-title");
      [...headline].forEach((letter, index) => {
        const span = document.createElement("span");
        span.className = "letter";
        span.setAttribute("aria-hidden", "true");
        span.style.animationDelay = `${1 + index * 0.09}s`;
        span.textContent = letter === " " ? "\u00a0" : letter;
        title.append(span);
      });

      const canvas = document.querySelector(".fireflies");
      const context = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0;
      let height = 0;
      let frame = 0;
      let fireflies = [];

      const createFireflies = () => Array.from({ length: 70 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: 0.8 + Math.random() * 1.8,
        speed: 0.12 + Math.random() * 0.38,
        amplitude: 5 + Math.random() * 20,
        phase: Math.random() * Math.PI * 2,
        frequency: 0.0008 + Math.random() * 0.0014,
        opacity: 0.35 + Math.random() * 0.55,
        amber: Math.random() > 0.58
      }));

      const resize = () => {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        fireflies = createFireflies();
      };

      const draw = (time) => {
        context.clearRect(0, 0, width, height);
        fireflies.forEach((firefly) => {
          const pulse = 0.55 + Math.sin(time * 0.0015 + firefly.phase) * 0.25;
          const wobble = Math.sin(time * firefly.frequency + firefly.phase) * firefly.amplitude;
          const color = firefly.amber ? "255, 194, 105" : "183, 222, 153";
          context.beginPath();
          context.fillStyle = `rgba(${color}, ${firefly.opacity * pulse})`;
          context.shadowColor = `rgba(${color}, 0.9)`;
          context.shadowBlur = firefly.radius * 7;
          context.arc(firefly.x + wobble, firefly.y, firefly.radius, 0, Math.PI * 2);
          context.fill();
          if (!reduceMotion) {
            firefly.y -= firefly.speed;
            if (firefly.y < -firefly.radius) {
              firefly.y = height + firefly.radius;
              firefly.x = Math.random() * width;
            }
          }
        });
        context.shadowBlur = 0;
        if (!reduceMotion) frame = requestAnimationFrame(draw);
      };

      resize();
      draw(0);
      if (!reduceMotion) frame = requestAnimationFrame(draw);
      window.addEventListener("resize", resize);
      window.addEventListener("pagehide", () => {
        cancelAnimationFrame(frame);
        window.removeEventListener("resize", resize);
      }, { once: true });
    })();
  </script>
</body>
</html>
